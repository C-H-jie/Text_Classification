# FocalLoss + SupCon + FGM 对抗训练，加大扰动
# 基于 focal λ=0.1 最优配置
model_name: hfl/chinese-roberta-wwm-ext
train_path: Dataset/roberta_train.xlsx
test_path: Dataset/roberta_test.xlsx
output_dir: outputs/focal_gamma5.0

max_length: 192
pooling: cls
batch_size: 16
eval_batch_size: 32
gradient_accumulation_steps: 1

learning_rate: 3.0e-05
epochs: 12
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
dropout: 0.2

classification_loss: focal
focal_gamma: 5.0

contrastive_loss: supervised_contrastive
contrastive_dim: 64
temperature: 0.07
lambda_contrast: 0.1

use_fgm: false

validation_split: 0.2
split_strategy: group_aware_split_if_feasible
main_metric: accuracy
early_stopping_patience: 5
seed: 42
