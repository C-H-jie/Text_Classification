# 基于 joint_tuned 最优参数 + FocalLoss 替 CrossEntropy
# 目标：解决"安全"/"其他"边界模糊导致的难样本分错问题
#
# 与 joint_tuned 的区别：
#   classification_loss: focal (原: cross_entropy)
#   focal_gamma: 2.0        让模型聚焦于 pt 低的难样本
#   dropout: 0.2            适度提高正则（原: 0.1）
#   contrastive_dim: 64     小数据下降维，减少过拟合（原: 128）
#   epochs: 12              给 focal loss 更多收敛时间
#   early_stopping_patience: 4
model_name: hfl/chinese-roberta-wwm-ext

train_path: Dataset/roberta_train.xlsx
test_path: Dataset/roberta_test.xlsx
output_dir: outputs/roberta_supcon_focal

max_length: 192
pooling: cls
batch_size: 16
eval_batch_size: 32
gradient_accumulation_steps: 1

learning_rate: 3.0e-05
epochs: 100
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
dropout: 0.2

classification_loss: focal
focal_gamma: 2.0

contrastive_loss: supervised_contrastive
contrastive_dim: 64
temperature: 0.07
lambda_contrast: 0.1

validation_split: 0.2
split_strategy: group_aware_split_if_feasible
main_metric: accuracy
early_stopping_patience: 5
seed: 42
