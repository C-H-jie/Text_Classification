# ProtoSupConLoss 配置：实例-实例 + 实例-原型 双支路对比学习
# 适合小样本场景（~270 条 / 3 分类），原型支路弥补 batch 内正样本不足
model_name: hfl/chinese-roberta-wwm-ext
train_path: Dataset/roberta_train.xlsx
test_path: Dataset/roberta_test.xlsx
output_dir: outputs/proto_focal_a0.5

max_length: 192
pooling: cls
batch_size: 16
eval_batch_size: 32
gradient_accumulation_steps: 1

learning_rate: 3.0e-05
epochs: 12
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
dropout: 0.2

classification_loss: focal
focal_gamma: 2.0
contrastive_loss: proto_supervised_contrastive
contrastive_dim: 64
temperature: 0.07
lambda_contrast: 0.1
proto_alpha: 0.5


validation_split: 0.2
split_strategy: group_aware_split_if_feasible
main_metric: accuracy
early_stopping_patience: 5
seed: 42
